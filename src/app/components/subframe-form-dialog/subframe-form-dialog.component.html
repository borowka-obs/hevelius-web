<h2 mat-dialog-title>{{ mode === 'add' ? 'Add subframe' : 'Edit subframe' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Filter</mat-label>
      <mat-select formControlName="filter_id" [disabled]="mode === 'edit'">
        @for (f of filters; track f.filter_id) {
          <mat-option [value]="f.filter_id">{{ f.short_name }} – {{ f.full_name || '-' }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Exposure time (s)</mat-label>
      <input matInput type="number" formControlName="exposure_time" min="0" step="0.1">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Count</mat-label>
      <input matInput type="number" formControlName="count" min="0">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Goal count</mat-label>
      <input matInput type="number" formControlName="goal_count" min="0">
    </mat-form-field>
    <mat-checkbox formControlName="active">Active</mat-checkbox>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()">{{ mode === 'add' ? 'Add' : 'Save' }}</button>
</mat-dialog-actions>
