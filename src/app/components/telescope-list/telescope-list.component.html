<div class="container">
  <div class="filters" [@filterExpand]="isFilterVisible ? 'expanded' : 'collapsed'">
    <form [formGroup]="filterForm" class="filter-form">
      <mat-checkbox formControlName="activeOnly" class="filter-field">Show only active</mat-checkbox>
      <div class="filter-actions">
        <button mat-button (click)="clearFilters()">Clear</button>
        <button mat-raised-button color="primary" (click)="applyFilters()">Apply</button>
      </div>
    </form>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)" class="mat-elevation-z8">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by name">Name</th>
        <td mat-cell *matCellDef="let telescope">
          <a [routerLink]="['/scopes', telescope.scope_id]" class="scope-link">{{ telescope.name }}</a>
        </td>
      </ng-container>
      <ng-container matColumnDef="descr">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let telescope">{{telescope.descr}}</td>
      </ng-container>
      <ng-container matColumnDef="optics">
        <th mat-header-cell *matHeaderCellDef>Optics</th>
        <td mat-cell *matCellDef="let telescope">{{getOpticsLabel(telescope)}}</td>
      </ng-container>
      <ng-container matColumnDef="min_dec">
        <th mat-header-cell *matHeaderCellDef>Min Dec</th>
        <td mat-cell *matCellDef="let telescope">{{telescope.min_dec}}</td>
      </ng-container>
      <ng-container matColumnDef="max_dec">
        <th mat-header-cell *matHeaderCellDef>Max Dec</th>
        <td mat-cell *matCellDef="let telescope">{{telescope.max_dec}}</td>
      </ng-container>
      <ng-container matColumnDef="sensor">
        <th mat-header-cell *matHeaderCellDef>Sensor</th>
        <td mat-cell *matCellDef="let telescope">{{telescope.sensor?.name ?? '-'}}</td>
      </ng-container>
      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by active">Active</th>
        <td mat-cell *matCellDef="let telescope">
          <mat-icon [style.color]="telescope.active ? 'green' : 'red'">
            {{telescope.active ? 'check_circle' : 'cancel'}}
          </mat-icon>
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let telescope">
          <button mat-icon-button (click)="openEditTelescope(telescope)" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
