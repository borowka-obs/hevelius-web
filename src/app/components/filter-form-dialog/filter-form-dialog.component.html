<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Short name</mat-label>
      <input matInput formControlName="short_name" maxlength="8" required>
      <mat-hint>e.g. SG, CV (max 8 chars)</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Full name</mat-label>
      <input matInput formControlName="full_name">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>URL</mat-label>
      <input matInput formControlName="url" type="url">
    </mat-form-field>
    <mat-checkbox formControlName="active">Active</mat-checkbox>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()">Create</button>
</mat-dialog-actions>
