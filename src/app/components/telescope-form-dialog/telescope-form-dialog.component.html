<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="descr" rows="2"></textarea>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Focal length (mm)</mat-label>
      <input matInput type="number" formControlName="focal" min="0" step="0.1">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Aperture (mm)</mat-label>
      <input matInput type="number" formControlName="aperture" min="0" step="0.1">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Min Dec</mat-label>
      <input matInput type="number" formControlName="min_dec" step="0.1">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Max Dec</mat-label>
      <input matInput type="number" formControlName="max_dec" step="0.1">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Longitude</mat-label>
      <input matInput type="number" formControlName="lon" step="0.0001">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Latitude</mat-label>
      <input matInput type="number" formControlName="lat" step="0.0001">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Altitude</mat-label>
      <input matInput type="number" formControlName="alt" min="0" step="0.1">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Sensor</mat-label>
      <mat-select formControlName="sensor_id">
        <mat-option [value]="null">None</mat-option>
        @for (s of sensors; track s.sensor_id) {
          <mat-option [value]="s.sensor_id">{{ s.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-checkbox formControlName="active">Active</mat-checkbox>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()">{{ mode === 'add' ? 'Create' : 'Save' }}</button>
</mat-dialog-actions>
