<div class="container">
  @if (isMobile) {
    <div class="mobile-cards">
      @for (c of catalogs; track c.shortname) {
        <div
          class="catalog-card"
          (click)="openCatalog(c)"
          (keyup.enter)="openCatalog(c)"
          tabindex="0"
          role="button"
          [attr.aria-label]="'Browse objects in ' + c.shortname">
          <div class="card-line1">
            <span class="card-shortname">{{ c.shortname }}</span>
            <span class="card-count">{{ c.object_count | number }} objects</span>
          </div>
          <div class="card-name">{{ c.name }}</div>
        </div>
      } @empty {
        <div class="no-results">No catalogs installed.</div>
      }
    </div>
  } @else {
    <div class="table-container">
      <table
        mat-table
        [dataSource]="catalogs"
        matSort
        (matSortChange)="onSortChange($event)"
        class="mat-elevation-z8">
        <ng-container matColumnDef="shortname">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th>
          <td mat-cell *matCellDef="let c">
            <button type="button" class="catalog-link" (click)="openCatalog(c)">{{ c.shortname }}</button>
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
          <td mat-cell *matCellDef="let c">{{ c.name }}</td>
        </ng-container>

        <ng-container matColumnDef="object_count">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Objects</th>
          <td mat-cell *matCellDef="let c">{{ c.object_count | number }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="clickable" (click)="openCatalog(row)"></tr>
      </table>
    </div>
  }
</div>
