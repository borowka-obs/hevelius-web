<div class="container">
  <div class="filters" [@filterExpand]="isFilterVisible ? 'expanded' : 'collapsed'">
    <form [formGroup]="filterForm" class="filter-form">
      <mat-checkbox formControlName="activeOnly" class="filter-field">Show only active</mat-checkbox>
      <mat-form-field class="filter-field" subscriptSizing="dynamic">
        <mat-label>Telescope</mat-label>
        <mat-select formControlName="scope_id">
          <mat-option [value]="null">All</mat-option>
          @for (s of scopes; track s.scope_id) {
            <mat-option [value]="s.scope_id">{{ s.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <div class="filter-actions">
        <button mat-button (click)="clearFilters()">Clear</button>
        <button mat-raised-button color="primary" (click)="applyFilters()">Apply</button>
      </div>
    </form>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)" class="mat-elevation-z8">
      <ng-container matColumnDef="project_id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by ID">ID</th>
        <td mat-cell *matCellDef="let p">{{ p.project_id }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by name">Name</th>
        <td mat-cell *matCellDef="let p">
          <button
            type="button"
            class="project-link-button"
            (click)="openProject(p)">
            {{ p.name }}
          </button>
        </td>
      </ng-container>
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let p">{{ p.description ?? '-' }}</td>
      </ng-container>
      <ng-container matColumnDef="scope_id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by scope">Scope</th>
        <td mat-cell *matCellDef="let p">{{ getScopeName(p.scope_id) }}</td>
      </ng-container>
      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by active">Active</th>
        <td mat-cell *matCellDef="let p">
          <mat-icon [style.color]="p.active ? 'green' : 'red'">
            {{ p.active ? 'check_circle' : 'cancel' }}
          </mat-icon>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (dblclick)="openProject(row)" class="clickable"></tr>
    </table>
  </div>
</div>
