<mat-toolbar color="primary">
  <span>{{ title }}</span>
  <span class="spacer"></span>
  @if (showFilter) {
    <button mat-icon-button (click)="toggleFilter()" [matTooltip]="filterVisible ? 'Hide filters' : 'Show filters'">
      <mat-icon>filter_list</mat-icon>
    </button>
  }
  @if (showAdd) {
    <button mat-icon-button (click)="onAddClickHandler()" [matTooltip]="addTooltip" aria-label="Add">
      <mat-icon>add</mat-icon>
    </button>
  }
  <button mat-icon-button (click)="navigateToUser()" matTooltip="User profile" aria-label="User profile">
    <img [src]="avatarUrl" alt="User avatar" class="avatar-icon">
  </button>
  <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Menu">
    <mat-icon>menu</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item routerLink="/projects">
      <mat-icon>folder</mat-icon>
      <span>Projects</span>
    </button>
    <button mat-menu-item routerLink="/tasks">
      <mat-icon>list</mat-icon>
      <span>Tasks</span>
    </button>
    <button mat-menu-item routerLink="/night-plan">
      <mat-icon>nightlight</mat-icon>
      <span>Night Plan</span>
    </button>
    <button mat-menu-item routerLink="/scopes">
      <mat-icon>visibility</mat-icon>
      <span>Telescopes</span>
    </button>
    <button mat-menu-item routerLink="/sensors">
      <mat-icon>photo_camera</mat-icon>
      <span>Sensors</span>
    </button>
    <button mat-menu-item routerLink="/filters">
      <mat-icon>filter_alt</mat-icon>
      <span>Filters</span>
    </button>
    <button mat-menu-item routerLink="/catalogs">
      <mat-icon>star</mat-icon>
      <span>Catalogs</span>
    </button>
    <button mat-menu-item (click)="openAboutDialog()">
      <mat-icon>info</mat-icon>
      <span>About</span>
    </button>
    <button mat-menu-item routerLink="/user">
      <mat-icon>person</mat-icon>
      <span>User</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="logout()">
      <mat-icon>exit_to_app</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>

<div class="content">
  <router-outlet></router-outlet>
</div>
