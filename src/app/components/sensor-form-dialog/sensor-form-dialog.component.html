<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Resolution X (px)</mat-label>
      <input matInput type="number" formControlName="resx" min="1" required>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Resolution Y (px)</mat-label>
      <input matInput type="number" formControlName="resy" min="1" required>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Pixel size X (µm)</mat-label>
      <input matInput type="number" formControlName="pixel_x" min="0" step="0.1" required>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Pixel size Y (µm)</mat-label>
      <input matInput type="number" formControlName="pixel_y" min="0" step="0.1" required>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Bits</mat-label>
      <input matInput type="number" formControlName="bits" min="0">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Width (mm)</mat-label>
      <input matInput type="number" formControlName="width" min="0" step="0.01">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Height (mm)</mat-label>
      <input matInput type="number" formControlName="height" min="0" step="0.01">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Vendor</mat-label>
      <input matInput formControlName="vendor">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>URL</mat-label>
      <input matInput formControlName="url" type="url">
    </mat-form-field>
    <mat-checkbox formControlName="active">Active</mat-checkbox>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()">{{ mode === 'add' ? 'Create' : 'Save' }}</button>
</mat-dialog-actions>
